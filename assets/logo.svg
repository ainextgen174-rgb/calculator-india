# CALCULATOR INDIA

CALCULATOR INDIA is a premium calculator web app designed with a modern Indian-inspired aesthetic and mobile-first responsiveness. It is fully functional, fast, and can be hosted for free on GitHub Pages.

## Features
- Basic calculator functions
- Scientific calculator tools
- Calculation history with local storage
- Memory functions (M+, M-, MR, MS, MC)
- Copy and paste support
- Percentage and square root
- Dark mode and light mode
- Customizable settings
- Responsive mobile layout

## Run locally
Open `index.html` in a browser, or serve the repository with a simple local server:

```bash
python3 -m http.server 8000
```

Then visit `http://localhost:8000`.

## GitHub Pages
1. Push this repository to GitHub.
2. Open the repository on GitHub.
3. Go to Settings → Pages.
4. Choose the default branch (`main`) and `/ (root)` folder.
5. Save the settings.

Your app will be available at:

`https://<your-username>.github.io/calculator-india/`

## Project structure
- `index.html` – App layout
- `styles.css` – Premium UI styling
- `app.js` – Logic for calculator functions and storage
- `assets/logo.svg` – App logo

